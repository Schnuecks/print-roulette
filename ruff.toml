line-length = 120
target-version = "py312"

[lint]
# E/F: errors and style, B: pitfalls, S: security rules (bandit), UP: modern syntax
select = ["E", "F", "B", "S", "UP"]
ignore = [
  "S311",  # random is fine for rolling; nothing cryptographic is rolled here
  "S104",  # 0.0.0.0 is intended inside the container
]
