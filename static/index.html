<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Roulette</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --fg:#18181b; --muted:#71717a; --border:#e4e4e7; --accent:#71717a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --card:#1c1c1f; --fg:#f4f4f5; --muted:#a1a1aa; --border:#2a2a2e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  main { width:100%; max-width:520px; text-align:center; }
  h1 { font-size:1.1rem; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin:0 0 20px; }
  .card { background:var(--card); border:2px solid var(--border); border-top:8px solid var(--accent); border-radius:16px;
          padding:24px; min-height:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px;
          transition:border-color .3s, box-shadow .3s; box-shadow:0 0 0 0 var(--accent); }
  .card.hit { box-shadow:0 8px 32px -12px var(--accent); }
  .card img { max-width:100%; max-height:240px; min-height:60px; border-radius:10px; object-fit:cover; background:var(--bg); }
  .card a.title { color:var(--fg); font-size:1.35rem; font-weight:600; text-decoration:none; word-break:break-word; }
  .card a.title:hover { text-decoration:underline; }
  .card small { color:var(--muted); }
  .card .badge { display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
                 color:#fff; background:var(--accent); border-radius:999px; padding:2px 10px; }
  .card .error { color:#dc2626; }
  .buttons { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px; }
  button { padding:12px 22px; font-size:.95rem; font-weight:600; color:#fff; background:var(--btn, #555);
           border:0; border-radius:999px; cursor:pointer; transition:transform .1s, filter .15s; }
  button:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.busy { cursor:wait; opacity:.7; }
  footer { margin-top:28px; color:var(--muted); font-size:.8rem; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Print Roulette</h1>
  <div class="card" id="card"><small>Wähl eine Plattform und lass dich überraschen.</small></div>
  <div class="buttons" id="buttons"></div>
  <footer>Unabhängiges Hobbyprojekt. Modelle und Bilder gehören den jeweiligen Plattformen und Erstellern.</footer>
</main>
<script>
  const card = document.getElementById('card');
  const buttons = document.getElementById('buttons');
  const root = document.documentElement;

  function el(tag, text, attrs) {
    const n = document.createElement(tag);
    if (text != null) n.textContent = text;
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    return n;
  }
  function setAccent(color) {
    root.style.setProperty('--accent', color || '#71717a');
  }

  async function draw(src, btn) {
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.classList.add('busy');
    setAccent(src.color);
    card.classList.remove('hit');
    card.replaceChildren(el('small', 'Würfle auf ' + src.name + '…'));
    try {
      const r = await fetch('/api/random?source=' + encodeURIComponent(src.key));
      const m = await r.json();
      if (!r.ok) throw new Error(m.error || r.statusText);
      const parts = [el('span', m.sourceName, { class: 'badge' })];
      if (m.image) {
        const img = el('img', null, { src: m.image, alt: m.title, referrerpolicy: 'no-referrer' });
        let tries = 0;
        img.onerror = () => {
          // Cults erzeugt Vorschaubilder erst beim ersten Abruf, das dauert oder liefert kurz 504
          if (++tries > 3) { img.remove(); return; }
          setTimeout(() => { img.src = m.image.includes('?') ? m.image : m.image + '#' + tries; }, 3000 * tries);
        };
        parts.push(img);
      }
      parts.push(el('a', m.title, { class: 'title', href: m.url, target: '_blank', rel: 'noopener' }));
      const meta = m.creator ? 'von ' + m.creator + ' · öffnet auf ' + m.sourceName : 'öffnet auf ' + m.sourceName;
      parts.push(el('small', meta));
      card.replaceChildren(...parts);
      card.classList.add('hit');
    } catch (e) {
      card.replaceChildren(el('small', 'Fehler: ' + e.message, { class: 'error' }));
    } finally {
      document.querySelectorAll('button').forEach(b => { b.disabled = b.dataset.off === '1'; });
      btn.classList.remove('busy');
    }
  }

  fetch('/api/sources').then(r => r.json()).then(list => {
    for (const src of list) {
      const b = el('button', src.name);
      b.style.setProperty('--btn', src.color);
      if (!src.enabled) {
        b.disabled = true;
        b.dataset.off = '1';
        b.title = src.reason || 'Nicht verfügbar';
      }
      b.addEventListener('click', () => draw(src, b));
      buttons.appendChild(b);
    }
  }).catch(e => {
    card.replaceChildren(el('small', 'Fehler: ' + e.message, { class: 'error' }));
  });
</script>
</body>
</html>
