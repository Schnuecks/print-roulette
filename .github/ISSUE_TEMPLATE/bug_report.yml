name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill in as much as you can;
        German is fine too.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: |
        Clicking "Cults3D" always shows an error instead of a model.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Print Roulette version
      description: Shown in the first log line, or run `python app.py --version` in the container.
      placeholder: e.g. 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - MakerWorld
        - Printables
        - Cults3D
        - Thingiverse
        - The page itself (wheel, filters, history)
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox on Windows, Safari on iPhone
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your environment variables, without keys and tokens.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The container log (`docker compose logs print-roulette`).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, reverse proxy setup, etc.
